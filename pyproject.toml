[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tonight"
version = "0.1.1"
description = "Rank a list of sky targets into an observing plan for one night at one site."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "RakTikoo" }]
keywords = ["astronomy", "observing", "planning", "astroplan", "astropy"]
dependencies = [
    "astropy>=6",
    "astroplan>=0.10",
    "numpy",
]

[project.scripts]
tonight = "tonight.cli:main"

[tool.setuptools.packages.find]
include = ["tonight*"]
